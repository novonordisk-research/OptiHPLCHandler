[project]
name = "Opti_HPLC_Handler"
version = "5.0.1"
description = "SDK for interacting with the Waters Empower Web API."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  { name="Søren Furbo", email="srfu@novonordisk.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "keyring>=24.0.0",
  "requests>=2.28.1",
]
# dynamic = ["version"] Possibly to be implemented in the future

[project.optional-dependencies]
dev = [
  "ruff>=0.16.10",
]
test = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "numpy>=2.5.3",
]
lint = [
  "ruff>=0.16.10",
]
release = [
  "bumpver==2026.1132",
]
build = [
  "build==1.0.3",
]
doc = [
  "pylint==3.0.2",
  "sphinx==9.1.0",
]
examples = [
  "python-dotenv==1.0.1",
]


[project.urls]
Repository = "https://github.com/novonordisk-research/OptiHPLCHandler.git"

[build-system]
requires = ["setuptools>=0.64.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "@abc.abstractmethod",
    "def __repr__(self):",
    # re-enable the standard pragma
    "pragma: no cover",
    "if TYPE_CHECKING",
]
precision = 2
omit = [
    "tests/*"
]


[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C901"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501", "F821"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.bumpver]
current_version = "5.0.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/OptiHPLCHandler/__init__.py*" = ['__version__ = "{version}"']
"conf.py" = ['release = "{version}"']

[tool.pylint."MESSAGES CONTROL"]
disable = ["invalid-name"]
